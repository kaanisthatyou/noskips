<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}noskips{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>">
<link rel="stylesheet" href="/static/zine.css">
<meta property="og:site_name" content="noskips">
<meta property="og:title" content="{% block og_title %}noskips{% endblock %}">
<meta property="og:description" content="{% block og_desc %}judge every song. keep receipts.{% endblock %}">
<meta name="twitter:card" content="summary_large_image">
{% block og_extra %}{% endblock %}
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <a class="wordmark" href="/">noskips ♪</a>
    <nav>
      {% if me %}
        <a href="/feed">feed</a>
        {% if me.handle %}<a href="/@{{ me.handle }}">your shelf</a>{% endif %}
        <a href="/settings">settings</a>
      {% else %}
        <a href="/login">sign in</a>
      {% endif %}
    </nav>
  </header>

  {% block body %}{% endblock %}

</div>

{% block script %}{% endblock %}
</body>
</html>
