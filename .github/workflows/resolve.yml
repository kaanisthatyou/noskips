# Works through the MusicBrainz backlog every fifteen minutes.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan only
# fires cron once a day, which is far too slow for a queue that grows every
# time somebody rates a song nobody has rated before. GitHub Actions is free
# for public repos and keeps the schedule visible in the repo.
#
# Set two repository secrets:
#   NOSKIPS_URL      e.g. https://noskips.vercel.app
#   RESOLVER_TOKEN   the same value as the RESOLVER_TOKEN env var on Vercel
name: resolve

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # so you can kick it by hand after a burst of ratings

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: ask the server to work through the queue
        run: |
          # --fail-with-body so a 4xx shows what the server said and fails loudly;
          # a silently dead cron is worse than no cron
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.NOSKIPS_URL }}/v1/internal/resolve?limit=20" \
            -H "Authorization: Bearer ${{ secrets.RESOLVER_TOKEN }}"
